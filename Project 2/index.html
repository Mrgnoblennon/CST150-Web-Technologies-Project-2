<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- provides a summary that search engines may display in search results -->
  <meta
    name="description"
    content="Explore Chase Barrett-Brown's portfolio, featuring programming, networking, cybersecurity and web development projects."
  >
  <!-- identifies page in browser tabs and can influence its title in search results -->
  <title>Chase Barrett-Brown | Cyber Security Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- terminal container -->
  <main class="terminal">
    <h1>Terminal Portfolio</h1>
    <!-- output area, id given for dedicated js functions-->
    <div id="terminal-output">
      <p>Welcome to my portfolio!</p>
      <p>Type 'help' to see available commands.</p>
    </div>
    <!-- command prompt as form for user input -->
    <form id="command-form">
      <label for="command-input">user@chases-portfolio:~$</label>
      <input
        id="command-input"
        type="text"
        name="command"
        autocomplete="off"
      >
    </form>
  </main>
  <script src="script.js"></script>
</body>

</html>
